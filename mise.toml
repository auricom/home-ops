[env]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = '{{config_root}}/kubernetes/kubeconfig'
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"

[hooks]
postinstall = "lefthook install"

[tools]
helm = "latest"
flux2 = "latest"
kubectl = "latest"
helmfile = "latest"
pipx = "latest"
"pipx:ansible-core" = { version = "latest", uvx_args = "--with boto3,botocore" }
talhelper = "latest"
"github:home-operations/flate" = "latest"
uv = "latest"
"aqua:mitsuhiko/minijinja" = "latest"
vals = "latest"
"1password-cli" = "2.35.0"
"github:mitsuhiko/minijinja" = "2.24.0"
jq = "1.8.2"
just = "1.58.0"
lefthook = "2.1.12"
node = "26.8.1"
oxfmt = "0.65.0"
shellcheck = "0.11.0"
talos = "1.14.0-rc.2"
yq = "4.53.6"
zizmor = "1.30.0"
kustomize = "latest"

[settings]
python.uv_venv_auto = "source"

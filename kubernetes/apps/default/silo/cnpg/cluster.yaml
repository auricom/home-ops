---
# Empty cluster. Do not point silo at this service.
# Cutover order is silo, then bookorbit, then Immich. See docs/cnpg-migration.md.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: silo-db
spec:
  instances: 1
  # Stock CloudNativePG PostgreSQL 18.6, digest resolved 2026-11-01.
  # Replace the image before pg_restore if `\dx` on silo-database shows
  # anything other than plpgsql. This image does not ship pgvector.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
  storage:
    size: 5Gi
    storageClass: ceph-block
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: silo-db-store
        serverName: silo-db
  externalClusters:
    - name: silo-db-restore
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: silo-db-store
          serverName: silo-db
  bootstrap:
    initdb:
      database: silo
      owner: silo
      secret:
        name: silo-db-app
  monitoring:
    enablePodMonitor: true

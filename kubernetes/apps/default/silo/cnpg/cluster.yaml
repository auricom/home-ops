---
# Empty cluster. Do not point silo at this service.
# Cutover order is silo, then bookorbit, then Immich. See docs/cnpg-migration.md.
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: silo-db
spec:
  instances: 1
  # PostgreSQL 18.6 with pgvector 0.8.7, verified against the live source.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
  storage:
    size: 5Gi
    storageClass: ceph-block
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: silo-db-store
        serverName: silo-db
  externalClusters:
    - name: silo-db-restore
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: silo-db-store
          serverName: silo-db
  bootstrap:
    initdb:
      database: silo
      owner: silo
      secret:
        name: silo-db-app
  monitoring:
    enablePodMonitor: true

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookstack
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bookstack
  values:
    externalSecrets:
      bookstack:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              APP_KEY: "{{ .BOOKSTACK_APP_KEY }}"
              DB_PASSWORD: "{{ .BOOKSTACK_MARIADB_PASSWORD }}"
              DB_HOST: 127.0.0.1
              DB_PORT: "3306"
              DB_DATABASE: bookstack
              DB_USERNAME: bookstack
              DB_ROOT_PASSWORD: "{{ .BOOKSTACK_MARIADB_ROOT_PASSWORD }}"
        dataFrom:
          - extract:
              key: bookstack
    controllers:
      bookstack:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/bookstack
              tag: 26.09.20260924
            env:
              TZ: Europe/Paris
              PUID: "1000"
              PGID: "1000"
              APP_URL: "https://docs.xpander.ovh"
              QUEUE_CONNECTION: database
            envFrom:
              - externalSecretRef:
                  identifier: bookstack
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: &port 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
          mariadb:
            image:
              repository: lscr.io/linuxserver/mariadb
              tag: 11.8.8
            env:
              TZ: Europe/Paris
              PUID: "1000"
              PGID: "1000"
              MYSQL_USER: bookstack
              MYSQL_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookstack
                    key: DB_PASSWORD
              MYSQL_DATABASE: bookstack
              MYSQL_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookstack
                    key: DB_ROOT_PASSWORD
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["docs.xpander.ovh"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: *app
        advancedMounts:
          bookstack:
            app:
              - path: /config
                subPath: app
            mariadb:
              - path: /config
                subPath: db

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homelab-github-notifier
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: homelab-github-notifier
  values:
    externalSecrets:
      homelab-github-notifier:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            engineVersion: v2
            data:
              # pushover
              PUSHOVER_USER_KEY: " {{ .PUSHOVER_USER_KEY }}"
              # pushover-notifier
              HEALTHCHECKS_ID: "{{ .GITHUB_RELEASES_HEALTHCHECKS_ID }}"
              PUSHOVER_APP_TOKEN: "{{ .PUSHOVER_APP_TOKEN }}"
              # github
              GITHUB_API_TOKEN: "{{ .GITHUB_API_TOKEN }}"
        dataFrom:
          - extract:
              key: pushover
          - extract:
              key: pushover-notifier
    defaultPodOptions:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
    controllers:
      music-transcode:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: 0 */3 * * * # Every 3 hours
        containers:
          app:
            image:
              repository: ghcr.io/auricom/toolbox
              tag: rolling@sha256:bf1759627456ec1265191f7bfb811f0da9bf68f7fa156f040bb6f5bed74e7553
            command:
              - python
              - /app/github-notifier.py
            envFrom:
              - externalSecretRef:
                  identifier: homelab-github-notifier
    service:
      app:
        controller: *app
        enabled: false
    persistence:
      config:
        type: configMap
        name: homelab-github-notifier-configmap
        defaultMode: 0644 # trunk-ignore(yamllint/octal-values)
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      data:
        existingClaim: *app
        globalMounts:
          - path: /data
      script:
        type: configMap
        name: homelab-github-notifier-configmap
        defaultMode: 0644 # trunk-ignore(yamllint/octal-values)
        globalMounts:
          - path: /app/github-notifier.py
            subPath: github-notifier.py
            readOnly: true

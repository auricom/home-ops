---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homelab-music-transcode
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: homelab-music-transcode
  values:
    externalSecrets:
      homelab-music-transcode:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              HEALTHCHECKS_ID: "{{ .MUSIC_TRANSCODE_HEALTHCHECKS_ID }}"
        dataFrom:
          - extract:
              key: homelab-nas
    controllers:
      music-transcode:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "@daily"
        containers:
          app:
            image:
              repository: ghcr.io/auricom/music-transcode
              tag: rolling@sha256:b9db77e2e74f48e149d083ed82c26c259e01c298a0a8be2809ef0ad177db7e31
            command:
              - /bin/bash
              - -c
              - |
                #!/bin/bash

                set -o errexit
                set -o nounset

                if [[ -n "$HEALTHCHECKS_ID" ]]; then
                    wget "https://hc-ping.com/$HEALTHCHECKS_ID/start" -T 10 -t 5 -O /dev/null
                fi

                cd /app

                /app/transcode.sh -c
                /app/transcode.sh -r

                # Send completion ping to healthchecks
                if [[ -n "$HEALTHCHECKS_ID" ]]; then
                    wget "https://hc-ping.com/$HEALTHCHECKS_ID" -T 10 -t 5 -O /dev/null
                fi
            env:
              TRANSCODE_INPUT_DIR: /mnt/music
              TRANSCODE_OUTPUT_DIR: /mnt/music_transcoded
              TRANSCODE_FREAC_BIN: /app/freaccmd
            envFrom:
              - externalSecretRef:
                  identifier: homelab-music-transcode
    service:
      app:
        controller: *app
        enabled: false
    persistence:
      scripts:
        type: configMap
        name: homelab-music-transcode-configmap
        defaultMode: 0775 # trunk-ignore(yamllint/octal-values)
        globalMounts:
          - path: /app/transcode.sh
            subPath: transcode.sh
            readOnly: true
      exclude:
        type: configMap
        name: homelab-music-transcode-configmap
        defaultMode: 0644 # trunk-ignore(yamllint/octal-values)
        globalMounts:
          - path: /app/transcode_exclude.cfg
            subPath: transcode_exclude.cfg
            readOnly: true
      music:
        type: nfs
        path: /mnt/vol1/music
        server: 192.168.30.10
        globalMounts:
          - path: /mnt/music
      music-transcoded:
        type: nfs
        path: /mnt/vol1/music_transcoded
        server: 192.168.30.10
        globalMounts:
          - path: /mnt/music_transcoded

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app resilio-claude
spec:
  commonMetadata:
  path: ./kubernetes/apps/default/resilio-sync/claude
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
  interval: 1h
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_SCHEDULE: "18 1,13 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app resilio-helene
spec:
  path: ./kubernetes/apps/default/resilio-sync/helene
  components:
    - ../../../../components/zeroscaler
    - ../../../../components/kopiur/backup
  interval: 1h
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_SCHEDULE: "20 1,13 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false

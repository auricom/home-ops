---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app komga
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: komga
  values:
    controllers:
      komga:
        annotations:
          secret.reloader.stakater.com/reload: authelia
        containers:
          app:
            image:
              repository: gotson/komga
              tag: 1.27.1@sha256:9cf102f5fb78e2e020700c53eca757e4f4d4e347121b0a16380822760337cca9
            env:
              TZ: "Europe/Paris"
              SERVER_PORT: &port 8080
            resources:
              requests:
                memory: 512Mi
                cpu: 15m
              limits:
                memory: 2Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.xpander.ovh"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /config
      comics:
        type: nfs
        server: 192.168.30.10
        path: /mnt/vol1/home/claude/comics
        globalMounts:
          - path: /mnt/storage/home/claude/comics

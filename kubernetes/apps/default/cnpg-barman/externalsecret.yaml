---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudnative-pg
    template:
      data:
        # 1Password item `cloudnative-pg`. ObjectStore reads ACCESS_KEY_ID
        # and ACCESS_SECRET_KEY; the item fields stay prefixed.
        ACCESS_KEY_ID: "{{ .CLOUDNATIVE_PG__AWS_ACCESS_KEY }}"
        ACCESS_SECRET_KEY: "{{ .CLOUDNATIVE_PG__AWS_SECRET_KEY }}"
        AWS_REGION: garage
  dataFrom:
    - extract:
        key: cloudnative-pg

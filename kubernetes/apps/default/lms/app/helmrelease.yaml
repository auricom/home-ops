---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lms
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: lms
  values:
    controllers:
      lms:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lms-community/lyrionmusicserver
              tag: 9.2.0@sha256:8bd6a0650d3049b2ffe3b84f1952c7e9a8d622f586bfacbaf90900ac742d06bc
            env:
              AUDIO_DIR: &claude-music /mnt/claude-musique
              PLAYLIST_DIR: &playlists /mnt/playlists
              PUID: "1000"
              PGID: "1000"
            resources:
              requests:
                memory: 250Mi
                cpu: 15m
              limits:
                memory: 4096Mi
    service:
      app:
        controller: *app
        type: LoadBalancer
        loadBalancerIP: 192.168.69.116
        externalTrafficPolicy: Local
        ports:
          http:
            port: &port 9000
          cli:
            enabled: true
            port: 9090
            protocol: TCP
          slimproto:
            enabled: true
            port: 3483
            protocol: TCP
          slimproto-udp:
            enabled: true
            port: 3483
            protocol: UDP
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
        hostnames: ["{{ .Release.Name }}.xpander.ovh"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: *app
        globalMounts:
          - path: /config
      music:
        type: nfs
        server: 192.168.30.10
        path: /mnt/vol1/music
        globalMounts:
          - path: *claude-music
      music-helene:
        type: nfs
        server: 192.168.30.10
        path: /mnt/vol1/home/helene/Musique
        globalMounts:
          - path: /mnt/helene-musique
      playlists:
        type: nfs
        server: 192.168.30.10
        path: /mnt/vol1/music/.lms
        globalMounts:
          - path: *playlists

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-db-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bookorbit-db-app
    template:
      data:
        # Empty-cluster role. The live app role is BOOKORBIT_POSTGRES_USERNAME.
        # Align them before cutover. See docs/cnpg-migration.md.
        username: bookorbit
        password: "{{ .BOOKORBIT_POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: bookorbit

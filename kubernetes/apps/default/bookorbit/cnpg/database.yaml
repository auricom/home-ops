---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bookorbit
spec:
  name: bookorbit
  owner: bookorbit
  cluster:
    name: bookorbit-db
  template: template0
  localeProvider: libc
  localeCollate: en_US.utf8
  localeCType: en_US.utf8
  extensions:
    - ensure: present
      name: pg_trgm
      version: "1.6"
    - ensure: present
      name: unaccent
      version: "1.1"
    - ensure: present
      name: uuid-ossp
      version: "1.1"
    - ensure: present
      name: vector
      version: "0.8.6"

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookorbit-database
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bookorbit-database
  values:
    externalSecrets:
      bookorbit-database:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              POSTGRES_USER: "{{ .BOOKORBIT_POSTGRES_USERNAME }}"
              POSTGRES_PASSWORD: "{{ .BOOKORBIT_POSTGRES_PASSWORD }}"
              POSTGRES_DB: "{{ .BOOKORBIT_POSTGRES_DB_NAME }}"
              DATABASE_URL: postgres://{{ .BOOKORBIT_POSTGRES_USERNAME}}:{{ .BOOKORBIT_POSTGRES_PASSWORD }}@bookorbit-database.default.svc.cluster.local.:5432/{{ .BOOKORBIT_POSTGRES_DB_NAME }}
        dataFrom:
          - extract:
              key: bookorbit
    controllers:
      primary:
        type: statefulset
        containers:
          postgresql:
            image:
              repository: pgvector/pgvector
              tag: pg18@sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
            env:
              PGDATA: /var/lib/postgresql/data/pgdata
            envFrom:
              - externalSecretRef:
                  identifier: bookorbit-database
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 750m
                memory: 768Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
        initContainers:
          init-postgres-permissions:
            image:
              repository: alpine
              tag: 3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            command:
              - /bin/sh
              - -c
              - |
                chown -R 999:999 $PGDATA
                chmod 700 $PGDATA
            env:
              PGDATA: /var/lib/postgresql/data
            securityContext:
              runAsUser: 0
              runAsGroup: 0
          # # Init Container for Major PostgreSQL Upgrades, not needed permanently
          # pgautoupgrade:
          #   image:
          #     repository: ghcr.io/pumba98/pgautoupgrade-vchord
          #     tag: 17-debian-v0.3.0
          #   # securityContext:
          #   #   runAsUser: 0
          #   #   runAsGroup: 0
          #   env:
          #     PGAUTO_ONESHOT: yes
          #     POSTGRES_USER: immich
          #     POSTGRES_DB: immich
          #     PGDATA: /var/lib/postgresql/data
    service:
      primary:
        controller: primary
        ports:
          postgresql:
            port: 5432
      # metrics:
      #   controller: primary
      #   ports:
      #     metrics:
      #       port: 9187
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/postgresql/data
    # serviceMonitor:
    #   main:
    #     enabled: true
    #     serviceName: immich-postgresql-metrics
    #     endpoints:
    #       - port: metrics

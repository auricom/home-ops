---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bookorbit-database
    template:
      data:
        # App
        JWT_SECRET: "{{ .BOOKORBIT_JWT_SECRET }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .BOOKORBIT_SETUP_BOOTSTRAP_TOKEN }}"
        EMAIL_ENCRYPTION_KEY: "{{ .BOOKORBIT_EMAIL_ENCRYPTION_KEY }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .BOOKORBIT_MIGRATION_ENCRYPTION_KEY }}"
        BOOK_REQUEST_ENCRYPTION_KEY: "{{ .BOOKORBIT_BOOK_REQUEST_ENCRYPTION_KEY }}"
        # Database
        POSTGRES_USER: bookorbit
        POSTGRES_PASSWORD: "{{ .BOOKORBIT_POSTGRES_PASSWORD }}"
        POSTGRES_DB: bookorbit
        DATABASE_URL: postgres://bookorbit:{{ .BOOKORBIT_POSTGRES_PASSWORD }}@bookorbit-db-rw.default.svc.cluster.local.:5432/bookorbit
  dataFrom:
    - extract:
        key: bookorbit

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-sync
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    externalSecrets:
      immich-sync:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              API_KEY: "{{ .IMMICH__SYNC_API_KEY }}"
        dataFrom:
          - extract:
              key: immich
    controllers:
      immich-sync:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "@daily"
        containers:
          app:
            image:
              repository: ghcr.io/salvoxia/immich-folder-album-creator
              tag: 2.0.2@sha256:bc44bdfa55b305a405e93054c9cbe1c591ce6b11c09c5d6a08bef219727a9954
            env:
              ALBUM_NAME_POST_REGEX1: "'(\\d+_)+'"
              ALBUM_NAME_POST_REGEX2: "'_' ' '"
              API_URL: http://immich.default.svc.cluster.local.:2283/api
              ROOT_PATH: /external_libs
              SHARE_WITH: Hélène
              SHARE_ROLE: viewer
              UNATTENDED: 1
              ALBUM_ORDER: asc
            envFrom:
              - externalSecretRef:
                  identifier: immich-sync
            probes:
              liveness: &probes
                enabled: false
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 150Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: *app
        enabled: false
    persistence:
      external:
        enabled: true
        type: nfs
        server: 192.168.30.10
        path: /mnt/vol1/photo/Export
        globalMounts:
          - path: /external_libs

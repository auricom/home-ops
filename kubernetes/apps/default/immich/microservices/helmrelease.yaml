---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-microservices
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  dependsOn:
    - name: immich
  values:
    controllers:
      immich-microservices:
        annotations:
          configmap.reloader.stakater.com/reload: &configMap immich-configmap
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: &secret immich-database
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.1@sha256:db996e352359771c6a3db121a0ed8761516b22f727fc092a0f46dcfef82c1bc1
            env:
              IMMICH_WORKERS_EXCLUDE: api
            envFrom:
              - configMapRef:
                  name: *configMap
              - secretRef:
                  name: *secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 8000Mi
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      library:
        enabled: true
        type: nfs
        server: 192.168.30.10
        path: /mnt/vol1/apps/immich
        globalMounts:
          - path: /data
      external:
        enabled: true
        type: nfs
        server: 192.168.30.10
        path: /mnt/vol1/photo/Export
        globalMounts:
          - path: /external_libs

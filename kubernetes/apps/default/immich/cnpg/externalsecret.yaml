---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: immich-db-app
    template:
      data:
        # Matches the commented pgautoupgrade POSTGRES_USER in the live
        # HelmRelease. Confirm against IMMICH__POSTGRES_USER before cutover.
        username: immich
        password: "{{ .IMMICH__POSTGRES_PASSWORD }}"
  dataFrom:
    - extract:
        key: immich

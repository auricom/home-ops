---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app elegoo-cc2-webui
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: elegoo-cc2-webui
  values:
    externalSecrets:
      elegoo-cc2-webui:
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            engineVersion: v2
            data:
              ACCESS_CODE: "{{.access_code}}"
        dataFrom:
          - extract:
              key: elegoo-cc2-webui
    controllers:
      elegoo-cc2-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/nyakaspeter/elegoo-cc2-webui
              tag: main@sha256:08194b0445d2e8994be283d6c9f16dd8f4fc259c855ec9ba978ad7dfb10e82ae
            env:
              PRINTER_HOST: 192.168.32.50
            envFrom:
              - externalSecretRef:
                  identifier: elegoo-cc2-webui
            resources:
              requests:
                memory: 250Mi
                cpu: 15m
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames: ["cc2.xpander.ovh"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

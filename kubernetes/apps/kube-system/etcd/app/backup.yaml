---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd-backup
spec:
  chartRef:
    kind: OCIRepository
    name: etcd
  interval: 1h
  values:
    defaultPodOptions:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    controllers:
      etcd-backup:
        type: cronjob
        cronjob:
          schedule: "10 */6 * * *"
          timeZone: Europe/Paris
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          successfulJobsHistory: 1
        pod:
          restartPolicy: OnFailure
        containers:
          app:
            image:
              repository: ghcr.io/siderolabs/talos-backup
              tag: v0.1.0-beta.3@sha256:0741255027c4dcae6bb8d4e18a824ba73c431d11b3dff4967e95b9ff5388cb85
            command: ["/talos-backup"]
            workingDir: /tmp
            env:
              AWS_REGION: garage
              CLUSTER_NAME: home
              ENABLE_COMPRESSION: "true"
              USE_PATH_STYLE: "true"
              HOME: /tmp
              ENDPOINT: 192.168.30.10:30188
              BUCKET: talos-backup
            envFrom:
              - secretRef:
                  name: etcd-backup-s3
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      talos-secrets:
        type: secret
        name: etcd-backup
        globalMounts:
          - path: /var/run/secrets/talos.dev
            readOnly: true

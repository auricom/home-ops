---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cloudnative-pg
  values:
    replicaCount: 1
    crds:
      create: true
    # Watch Clusters in the app namespaces (default), not only this namespace.
    config:
      clusterWide: true
    monitoring:
      podMonitorEnabled: true

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg.rules
spec:
  groups:
    - name: cloudnative-pg
      rules:
        - alert: CNPGInstanceDown
          expr: |
            cnpg_collector_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL in {{ $labels.namespace }}/{{ $labels.pod }} is down."
        - alert: CNPGWALArchivingFailing
          expr: |
            cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving is failing for {{ $labels.namespace }}/{{ $labels.pod }}."
        # ScheduledBackups run daily; 26h leaves room for a slow run.
        - alert: CNPGBackupStale
          expr: |
            time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 26 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No base backup for {{ $labels.namespace }}/{{ $labels.pod }} in over 26h."

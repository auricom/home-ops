---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unifi-feisar-ovh
spec:
  dnsNames:
    - unifi.feisar.ovh
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-feisar-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: unifi-feisar-ovh-tls
  usages:
    - digital signature

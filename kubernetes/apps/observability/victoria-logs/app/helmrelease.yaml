---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 30m
  values:
    fullnameOverride: victoria-logs
    global:
      image:
        registry: quay.io
    server:
      persistentVolume:
        enabled: true
        size: 50Gi
        storageClassName: ceph-block
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      retentionPeriod: 30d
      route:
        enabled: true
        hostnames:
          - victoria-logs.xpander.ovh
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
        spec:
          folderRef: victoria-logs

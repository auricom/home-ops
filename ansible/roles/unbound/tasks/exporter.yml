---
- name: exporter | validate architecture is supported
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture in unbound_exporter_arch_map
    fail_msg: >-
      Unsupported architecture '{{ ansible_facts.architecture }}' for unbound_exporter.
      Extend unbound_exporter_arch_map to add support.

- name: exporter | clone unbound_exporter source on controller
  ansible.builtin.git:
    repo: https://github.com/letsencrypt/unbound_exporter.git
    dest: "{{ unbound_exporter_src_dir }}"
    version: "{{ unbound_exporter_version }}"
    depth: 1
    update: false
  delegate_to: localhost
  become: false
  run_once: true

- name: exporter | build unbound_exporter on controller
  ansible.builtin.command:
    cmd: go build -trimpath -ldflags "-s -w" -o {{ unbound_exporter_artifact }} .
    chdir: "{{ unbound_exporter_src_dir }}"
    creates: "{{ unbound_exporter_artifact }}"
  environment: >-
    {{
      {'CGO_ENABLED': '0', 'GOOS': 'linux', 'GOARCH': unbound_exporter_arch}
      | combine({'GOARM': '6'} if unbound_exporter_arch == 'arm' else {})
    }}
  delegate_to: localhost
  become: false
  throttle: 1

- name: exporter | create unbound_exporter system user
  ansible.builtin.user:
    name: "{{ unbound_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: unbound
    append: true

- name: exporter | install unbound_exporter binary
  ansible.builtin.copy:
    src: "{{ unbound_exporter_artifact }}"
    dest: "{{ unbound_exporter_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: restart unbound_exporter

- name: exporter | template unbound remote-control config
  ansible.builtin.template:
    src: remote-control.conf.j2
    dest: /etc/unbound/unbound.conf.d/remote-control.conf
    owner: root
    group: root
    mode: "0644"
    validate: unbound-checkconf %s
  notify: restart unbound

- name: exporter | template unbound_exporter systemd unit
  ansible.builtin.template:
    src: unbound_exporter.service.j2
    dest: /etc/systemd/system/unbound_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart unbound_exporter

- name: exporter | flush handlers so unbound exposes the control socket
  ansible.builtin.meta: flush_handlers

- name: exporter | enable and start unbound_exporter
  ansible.builtin.systemd:
    name: unbound_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: exporter | wait for unbound_exporter to listen locally
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ unbound_exporter_listen_address.split(':')[-1] }}"
    timeout: 30

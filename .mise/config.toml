[env]
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
KUBECONFIG = "{{config_root}}/kubernetes/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
TALOSCONFIG = "{{config_root}}/talosconfig"
JUST_UNSTABLE = "1"

[hooks]
postinstall = "lefthook install"

[tools]
"1password-cli" = "2.35.0"
actionlint = "1.7.12"
flux2 = "2.9.6"
"github:home-operations/flate" = "0.6.5"
"github:mitsuhiko/minijinja" = "3.0.3"
helm = "4.3.1"
helmfile = { version = "1.8.2", workflow = "releaser.yaml" }
jq = "1.8.2"
just = "1.59.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "26.12.1"
oxfmt = "0.74.0"
pipx = "1.18.4"
"pipx:ansible-core" = "2.21.5"
shellcheck = "0.11.0"
talos = "1.14.5"
uv = "0.13.5"
vals = "0.50.0"
yq = "4.54.1"
zizmor = "1.31.1"

---
# DO NOT APPLY. Inert sketch for the silo cluster PR (the first cluster).
# Not referenced by any kustomization. See docs/cnpg-migration.md.
#
# Bookorbit and Immich copy this file later, one PR each, with the names
# swapped (bookorbit-db-store / bookorbit, immich-db-store / immich).
# They reuse secret postgresql-s3. Do not create a second ExternalSecret.
#
# Bucket `postgresql` is created on Garage before this is copied into
# kubernetes/. Endpoint and region match ClusterRepository/storage.
# The 1Password item `postgresql` is new. Do not point this at item `kopiur`
# or bucket `kopiur-k8s`. No key material belongs in git.
#
# Plugin API, not spec.backup.barmanObjectStore. Shape follows
# https://github.com/deedee-ops/home-ops/blob/master/kubernetes/components/postgresql/objectstore.yaml
# and scheduledbackup.yaml. Retention 7d. No endpoint CA: Garage TLS is off.
#
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-s3
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: postgresql-s3
    template:
      data:
        ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY }}"
        ACCESS_SECRET_KEY: "{{ .AWS_SECRET_KEY }}"
        AWS_REGION: garage
  dataFrom:
    - extract:
        key: postgresql
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: silo-db-store
  namespace: default
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://postgresql/silo
    endpointURL: http://192.168.30.10:30188
    s3Credentials:
      accessKeyId:
        name: postgresql-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgresql-s3
        key: ACCESS_SECRET_KEY
    region:
      name: postgresql-s3
      key: AWS_REGION
    wal:
      compression: gzip
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: silo-db
  namespace: default
spec:
  schedule: "0 0 * * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: silo-db

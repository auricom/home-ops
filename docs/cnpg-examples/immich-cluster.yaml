---
# DO NOT APPLY. Inert sketch for a later Immich PR.
# Not referenced by any kustomization. See docs/cnpg-migration.md.
#
# This Cluster is a new empty Postgres 18 beside the current StatefulSet.
# It does not mount PVC immich-database and it does not set bootstrap.recovery.
#
# Image pin, resolved 2026-11-01 from the GHCR manifest list for tag 18.0-0.5.3:
#   ghcr.io/tensorchord/cloudnative-vectorchord:18.0-0.5.3
#   sha256:267f6cbb32af6e109e138a143c7e9dd5d44d68433ec2303f0c30e745c788d1a9
# That tag is VectorChord 0.5.3 on PostgreSQL 18.0, the same extension line as
# ghcr.io/immich-app/postgres:18-vectorchord0.5.3 in the live HelmRelease.
# There is no 18-0.5.3 tag on this image. Do not substitute deedee's
# 18.6-1.1.1 pin; that is a VectorChord upgrade, not this migration.
# Re-check the digest in the Immich PR. Renovate does not scan docs/.
#
# spec.bootstrap.initdb.owner is the role named in the commented pgautoupgrade
# block of the live HelmRelease. Replace it if DB_USERNAME renders differently.
# The initdb secret must contain the same username and password as that secret.
# Create it from the existing 1Password item. Do not rotate the password here.
#
# WAL archiving uses the barman-cloud plugin (installed in the operator PR)
# and the ObjectStore in immich-barman.yaml. bootstrap stays initdb for the
# migration. Disaster recovery replaces initdb with:
#   bootstrap:
#     recovery:
#       source: immich-db-restore
# Do not set that until a completed Barman backup exists. Do not combine it
# with pg_restore into the same data directory.
#
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: default
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.0-0.5.3@sha256:267f6cbb32af6e109e138a143c7e9dd5d44d68433ec2303f0c30e745c788d1a9
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  postgresql:
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
  storage:
    size: 10Gi
    storageClass: ceph-block
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-db-store
        serverName: immich-db
  externalClusters:
    - name: immich-db-restore
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-db-store
          serverName: immich-db
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db-app
  monitoring:
    enablePodMonitor: true

---
# DO NOT APPLY. Inert sketch for a later Immich PR.
# Not referenced by any kustomization. See docs/cnpg-migration.md.
#
# Shape copied from deedee's Immich Database CR:
# https://github.com/deedee-ops/home-ops/blob/master/kubernetes/apps/immich-system/immich/database.yaml
# Adapted to this cluster: namespace default, cluster name immich-db, owner left
# as the role the commented pgautoupgrade block in the live HelmRelease already
# uses. Confirm that role equals the rendered secret key DB_USERNAME before copy.
#
# Live source of the extensions list is that deedee file. Before cutover, `\dx`
# on the current immich database must match this list. Add or remove entries
# from the live `\dx` output, not from memory.
#
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: default
spec:
  name: immich
  owner: immich
  cluster:
    name: immich-db
  extensions:
    - ensure: present
      name: cube
    - ensure: present
      name: earthdistance
    - ensure: present
      name: pg_trgm
    - ensure: present
      name: unaccent
    - ensure: present
      name: uuid-ossp
    - ensure: present
      name: vector
    - ensure: present
      name: vchord

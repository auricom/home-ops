# DO NOT APPLY. Inert sketch for the operator PR, copied later to
# kubernetes/apps/database/plugin-barman-cloud/app/kustomization.yaml
# with a sibling ks.yaml (targetNamespace: database), then listed from
# kubernetes/apps/database/kustomization.yaml.
#
# Not a Cluster. The operator PR installs this and the CloudNativePG
# HelmRelease, and stops there.
#
# The upstream manifest hardcodes namespace cnpg-system. `namespace: database`
# rewrites it so the plugin sits with the other database operators.
# No Cilium egress patches.
#
# v0.15.1 is the release referenced by deedee-ops on 2026-11-01.
# Re-check the tag in the operator PR.
#
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  # renovate: datasource=github-releases depName=cloudnative-pg/plugin-barman-cloud
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.1/manifest.yaml
